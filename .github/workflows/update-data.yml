name: Mise à jour des données Habous

on:
  # Volontairement MANUEL : rien n'est lu sur habous.gov.ma tant que vous ne lancez pas
  # ce workflow. Pour l'automatiser, ajoutez par exemple :
  #   schedule:
  #     - cron: "17 3 * * *"   # chaque jour ; ne scrape que si le cache expire dans moins de 3 jours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construire les données
        run: python tools/build_data.py --data-dir data
      - name: Publier si modifié
        run: |
          git config user.name "habous-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data custom_components/habous_prayer_times/cities.json
          git diff --cached --quiet || git commit -m "Mise à jour des horaires Habous"
          git push
